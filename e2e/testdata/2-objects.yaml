# What the end-to-end tests look at, in the namespace default. The
# images are pulled into the kind node by scripts/test-e2e.sh before
# this is applied, so that nothing is pulled while the tests run.

# marker prints a numbered line every second, for the tests of the logs.
apiVersion: v1
kind: Pod
metadata:
  name: marker
  namespace: default
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: marker
      image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - 'i=0; while true; do echo "kosh-e2e-marker $i"; i=$((i+1)); sleep 1; done'
---
# web is scaled and its pod killed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
---
# hidden holds a value no read-only key may see.
apiVersion: v1
kind: Secret
metadata:
  name: hidden
  namespace: default
type: Opaque
stringData:
  password: kosh-e2e-secret-value
---
apiVersion: e2e.kosh.test/v1
kind: Widget
metadata:
  name: gizmo
  namespace: default
spec:
  color: teal
