image:
  # The image to run.
  repository: ghcr.io/fables-for-robots/kosh
  # The image tag; empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Secrets for pulling the image, as a list of {name: ...}.
imagePullSecrets: []

# The key list: the text of an OpenSSH authorized_keys file, one key to a
# line, the comment after the key its name. The name ends in the role
# whose rights the key has: name/<role> for the ClusterRole <role>
# (alice@laptop/cluster-admin, bob@laptop/view), name/<role>@<namespace>
# for the Role <role> in <namespace> (carol/edit@team-a). kosh binds each
# role to the keys that name it. A line without a role, with an option,
# or whose role or namespace is not a Kubernetes name, is rejected. Note
# that /admin is the ClusterRole admin, not cluster-admin. Changing the
# list does not restart kosh, which follows the file. Whoever may edit
# this list, or the ConfigMap it is in, may give any key any role: keep
# the release's namespace writable by cluster administrators alone.
authorizedKeys: ""

ssh:
  # SSH over TCP. Without it there is no Service.
  enabled: true
  # The port in the container.
  port: 2222

service:
  # ClusterIP keeps SSH inside the cluster. LoadBalancer exposes it through a
  # load balancer; NodePort works too.
  type: ClusterIP
  # The Service's port.
  port: 22
  # Annotations of the Service, for the load balancer of the cloud at hand.
  annotations: {}
  # Who may reach the load balancer (LoadBalancer only).
  loadBalancerSourceRanges: []
  # Local keeps the client's address, which is then what kosh logs
  # (LoadBalancer and NodePort only).
  externalTrafficPolicy: Cluster

iroh:
  # SSH over iroh. It needs outgoing traffic only.
  enabled: true
  # Use the default relays and the pkarr record that makes kosh reachable.
  relay: true
  # Announce on the local network by mDNS.
  mdns: true
  # Run the pod on the host's network, for mDNS and direct connections.
  # The pod is then in the node's network: SSH's port (ssh.port) listens on
  # every address of the node, whatever service.type is. It is also outside
  # every NetworkPolicy, and can reach what listens on the node's loopback.
  # It applies only with iroh.enabled.
  hostNetwork: false
  # A fixed UDP port for the endpoint; null lets the system pick.
  port: null

state:
  # A Secret holding the two files of kosh's state, iroh.key and
  # ssh_host_ed25519_key (made by `kosh id`), mounted read-only.
  # Set this or state.persistence.enabled, and not both.
  existingSecret: ""
  persistence:
    # A PersistentVolumeClaim instead, on which kosh makes its keys at first start.
    enabled: false
    size: 16Mi
    # Empty means the cluster's default storage class.
    storageClass: ""

rbac:
  # Bind the ServiceAccount to a ClusterRole.
  create: true
  # The ClusterRole. A session acts as its key, impersonated by the
  # ServiceAccount, with the rights of the key's role; kosh makes the
  # bindings of those roles. The least the ServiceAccount needs:
  # impersonate on users and groups; get, list, create, update and delete
  # on clusterrolebindings and rolebindings; get on clusterroles and
  # roles; and bind on clusterroles and roles (or every right of the
  # roles the key list names). A ServiceAccount that may impersonate
  # anyone and bind any role is as powerful as cluster-admin, which says
  # that plainly.
  clusterRole: cluster-admin

serviceAccount:
  create: true
  # Empty means the release's full name.
  name: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
